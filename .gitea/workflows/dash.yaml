on:
  push:
    paths:
      - images/dash/**
  workflow_dispatch:

env:
  image_location: ./images/dash
  image_name: dash
  registry: gitea.epichouse.co.uk
  owner: dan
  dev_server: ldnapptst1
  dev_compose_project: dash-test
  prod_server: ldnappprd1
  prod_compose_project: dash

jobs:
  build_dev:
    runs-on: london
    defaults:
      run:
        working-directory: ${{ env.image_location }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Authenticate with Gitea
        run: docker login ${{ env.registry }} -u ${{ secrets.username }} -p ${{ secrets.password }}
      - name: Build Docker Image
        run: docker build -t ${{ env.registry }}/${{ env.owner }}/${{ env.image_name }}:development -f dockerfile .
      - name: Push Docker Image
        run: docker push ${{ env.registry }}/${{ env.owner }}/${{ env.image_name }}:development

  deploy_dev:
    runs-on: london
    needs: build_dev
    steps:
      - name: Pull Image (DEV)
        if: ${{ env.dev_server != '' }}
        run: |
          sshpass -p ${{ secrets.sa_password }} ssh sa@${{ env.dev_server }} -o StrictHostKeyChecking=accept-new \
          "sudo docker compose -f /var/lib/docker/compose/${{ env.dev_compose_project }}.yml pull \
          && sudo docker compose -f /var/lib/docker/compose/${{ env.dev_compose_project }}.yml up -d"

  build_prod:
    runs-on: london
    defaults:
      run:
        working-directory: ${{ env.image_location }}
    needs: deploy_dev
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Authenticate with Gitea
        run: docker login ${{ env.registry }} -u ${{ secrets.username }} -p ${{ secrets.password }}
      - name: Build Docker Image
        run: docker build -t ${{ env.registry }}/${{ env.owner }}/${{ env.image_name }}:latest -f dockerfile .
      - name: Push Docker Image
        run: docker push ${{ env.registry }}/${{ env.owner }}/${{ env.image_name }}:latest

  deploy_prod:
    runs-on: london
    needs: build_prod
    steps:
      - name: Pull Image (PROD)
        if: ${{ env.prod_server != '' }}
        run: |
          sshpass -p ${{ secrets.sa_password }} ssh sa@${{ env.prod_server }} -o StrictHostKeyChecking=accept-new \
          "sudo docker compose -f /var/lib/docker/compose/${{ env.prod_compose_project }}.yml pull \
          && sudo docker compose -f /var/lib/docker/compose/${{ env.prod_compose_project }}.yml up -d"