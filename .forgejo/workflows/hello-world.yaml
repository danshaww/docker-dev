on:
  push:
    paths:
      - images/hello-world/**
  workflow_dispatch:

jobs:
  build_dev:
    uses: dan/workflow-templates/.forgejo/workflows/docker-image-build.yml@main
    with:
      runner: london
      image_location: ./images/hello-world
      registry: git.epichouse.co.uk
      forgejo_url: ${{ github.server_url }}
      repository: ${{ github.repository }}
      owner: dan
      image_name: hello-world
      image_tag: development
    secrets: inherit

  deploy_dev:
    needs: build_dev
    uses: dan/workflow-templates/.forgejo/workflows/docker-compose-deploy.yml@main
    with:
      runner: london
      server: ldnapptst1
      compose_project: hello-world-test
      enabled: true
    secrets: inherit

  build_prod:
    needs: deploy_dev
    uses: dan/workflow-templates/.forgejo/workflows/docker-image-build.yml@main
    with:
      runner: london
      image_location: ./images/hello-world
      registry: git.epichouse.co.uk
      forgejo_url: ${{ github.server_url }}
      repository: ${{ github.repository }}
      owner: dan
      image_name: hello-world
      image_tag: latest
    secrets: inherit

  deploy_prod:
    needs: build_prod
    uses: dan/workflow-templates/.forgejo/workflows/docker-compose-deploy.yml@main
    with:
      runner: london
      server: ldnappprd1
      compose_project: hello-world
      enabled: true
    secrets: inherit